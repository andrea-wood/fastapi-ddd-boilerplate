apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyddd
  namespace: stem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyddd
  template:
    metadata:
      labels:
        app: pyddd
    spec:
      containers:
        - name: pyddd
          image: ghcr.io/andrea-wood/fastapi-ddd-boilerplate:test
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: pyddd
  namespace: stem
spec:
  selector:
    app: pyddd
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP